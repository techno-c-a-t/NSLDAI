<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00adb5" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#0b0d0e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0b0d0e" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80f3f7"/>
      <stop offset="50%" stop-color="#00adb5"/>
      <stop offset="100%" stop-color="#00797f"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)" stroke="#1f2327" stroke-width="4"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#00adb5" stroke-width="2" stroke-dasharray="12 8" opacity="0.6"/>

  <!-- Phantom Hood Outline -->
  <g filter="url(#neonGlow)">
    <!-- Hood -->
    <path d="M 256 70 C 170 70 140 140 140 230 C 140 270 150 310 130 360 C 170 340 210 350 256 320 C 302 350 342 340 382 360 C 362 310 372 270 372 230 C 372 140 342 70 256 70 Z" 
          fill="#121416" stroke="url(#cyanNeon)" stroke-width="6" stroke-linejoin="round"/>

    <!-- Inner Hood Shadow -->
    <path d="M 256 100 C 190 100 165 155 165 230 C 165 270 180 300 256 280 C 332 300 347 270 347 230 C 347 155 322 100 256 100 Z" 
          fill="#0b0d0e" stroke="#00adb5" stroke-width="2" opacity="0.8"/>

    <!-- Glowing Eyes -->
    <polygon points="200,195 240,215 210,225" fill="#80f3f7" filter="url(#neonGlow)"/>
    <polygon points="312,195 272,215 302,225" fill="#80f3f7" filter="url(#neonGlow)"/>

    <!-- Core AI Emblem (Eye/Node) -->
    <circle cx="256" cy="265" r="28" fill="#121416" stroke="url(#cyanNeon)" stroke-width="4"/>
    <circle cx="256" cy="265" r="14" fill="#80f3f7"/>

    <!-- Circuit Lines -->
    <path d="M 256 320 L 256 420 M 210 335 L 180 400 M 302 335 L 332 400" 
          stroke="url(#cyanNeon)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    
    <circle cx="256" cy="420" r="5" fill="#80f3f7"/>
    <circle cx="180" cy="400" r="4" fill="#00adb5"/>
    <circle cx="332" cy="400" r="4" fill="#00adb5"/>
  </g>

  <!-- Flowing Ether / Phantom Wings -->
  <path d="M 120 370 Q 100 420 140 450 Q 180 480 230 440" fill="none" stroke="url(#cyanNeon)" stroke-width="3" opacity="0.5" stroke-dasharray="6 6"/>
  <path d="M 392 370 Q 412 420 372 450 Q 332 480 282 440" fill="none" stroke="url(#cyanNeon)" stroke-width="3" opacity="0.5" stroke-dasharray="6 6"/>
</svg>
